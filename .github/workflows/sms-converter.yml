name: sms-converter

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Linux System Dependencies & FFmpeg
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3
        ffmpeg -version | head -n 1

    - name: Install Windows FFmpeg via Choco
      if: runner.os == 'Windows'
      run: |
        choco install ffmpeg --no-progress
        ffmpeg -version

    - name: Install Python Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pyinstaller

    - name: Run Unit Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python tools/sms_converter/test_converter.py

    - name: Run End-to-End Hardware Preset Tests
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python tools/sms_converter/test_end_to_end.py

    - name: Build Single Standalone Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SMS-Media-Converter" --icon "tools/sms_converter/assets/sms-converter.ico" --add-data "tools/sms_converter/assets;assets" --paths "tools/sms_converter" tools/sms_converter/main.py
        mkdir dist-artifact
        copy dist\SMS-Media-Converter.exe dist-artifact\SMS-Media-Converter.exe

    - name: Build Portable Package (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p dist-artifact/SMS-Media-Converter-Linux
        cp -r tools/sms_converter/* dist-artifact/SMS-Media-Converter-Linux/
        # Stable filename, NOT commit-stamped: the rolling release is updated in place rather
        # than recreated, so a per-commit name would add a new zip on every push and never
        # remove the old ones. The commit is already recorded in the release notes.
        cd dist-artifact && zip -r SMS-Media-Converter-Linux.zip SMS-Media-Converter-Linux/

    - name: Upload GitHub Actions Single EXE & Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: SMS-Media-Converter-${{ runner.os }}-${{ github.sha }}
        path: |
          dist-artifact/*.exe
          dist-artifact/*.zip
        retention-days: 90

    # --- Publish to Rolling Release on Master Push ---
    - name: Upload Windows Executable to Rolling Release
      if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        for i in {1..12}; do
          if gh release upload rolling dist-artifact/SMS-Media-Converter.exe --clobber; then
            echo "Uploaded SMS-Media-Converter.exe to rolling release!"
            break
          fi
          echo "Waiting for rolling release creation..."
          sleep 10
        done

    - name: Upload Linux Package to Rolling Release
      if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for i in {1..12}; do
          if gh release upload rolling dist-artifact/*.zip --clobber; then
            echo "Uploaded SMS-Media-Converter-Linux.zip to rolling release!"
            break
          fi
          echo "Waiting for rolling release creation..."
          sleep 10
        done

    # --- Publish to Version Release on Tag Push (v*) ---
    - name: Upload Windows Executable to Version Release
      if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        for i in {1..12}; do
          if gh release upload "$GITHUB_REF_NAME" dist-artifact/SMS-Media-Converter.exe --clobber; then
            echo "Uploaded SMS-Media-Converter.exe to release $GITHUB_REF_NAME!"
            break
          fi
          echo "Waiting for release $GITHUB_REF_NAME..."
          sleep 10
        done

    - name: Upload Linux Package to Version Release
      if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for i in {1..12}; do
          if gh release upload "$GITHUB_REF_NAME" dist-artifact/*.zip --clobber; then
            echo "Uploaded SMS-Media-Converter-Linux.zip to release $GITHUB_REF_NAME!"
            break
          fi
          echo "Waiting for release $GITHUB_REF_NAME..."
          sleep 10
        done

  # ---------------------------------------------------------------------------------------
  # Windows 7 build.
  #
  # Users on Windows 7 could not start the converter at all. That is not a bug we can patch
  # around -- it is three stacked platform floors, each a hard drop by the upstream project:
  #   * Qt 6 / PySide6 require Windows 10.
  #   * CPython 3.9+ dropped Windows 7; 3.8 is the last release that runs there.
  #   * PyInstaller 6 dropped its Windows 7 bootloader.
  # Hence the pins below. Raising ANY of them silently produces an .exe that will not start
  # on the machines this job exists to serve -- it builds and uploads perfectly happily.
  #
  # Same source, no fork: every module imports Qt through tools/sms_converter/qt_compat.py,
  # which prefers PySide6 and falls back to PySide2. A forked Win7 copy would quietly drift
  # out of sync with the preset and validator logic -- exactly the parts that decide whether
  # the output plays on a PS2 at all.
  #
  # Separate job so a failure here shows a red check WITHOUT blocking the modern build.
  # ---------------------------------------------------------------------------------------
  build-windows7:
    name: Build (Windows 7 compatible)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    # setup-python's OWN major version is not one of the pins described above -- it only
    # selects an interpreter. "3.8" still resolves to 3.8.10 here, which is python.org's last
    # Windows binary for the 3.8 line, so that ceiling is upstream's and not this action's.
    # python-version is the line that must not move.
    - name: Set up Python 3.8 (last release supporting Windows 7)
      uses: actions/setup-python@v7
      with:
        python-version: "3.8"

    # The unit suite includes a binary-detection test that needs ffmpeg on PATH, exactly as
    # the modern job does. Installing it here keeps BOTH jobs running the identical suite --
    # the point of this job is to prove the Qt5 fallback behaves the same, which is only
    # meaningful if it is held to the same tests.
    - name: Install Windows FFmpeg via Choco
      run: |
        choco install ffmpeg --no-progress
        ffmpeg -version

    - name: Install Windows 7 compatible dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tools/sms_converter/requirements-win7.txt

    - name: Verify the Qt shim really selected PySide2
      env:
        QT_QPA_PLATFORM: offscreen
      shell: bash
      run: |
        python -c "import sys; sys.path.insert(0,'tools/sms_converter'); import qt_compat; print('binding:', qt_compat.QT_BINDING); assert qt_compat.QT_BINDING=='PySide2', 'expected the Qt5 fallback here'"

    - name: Run Unit Tests under PySide2
      env:
        QT_QPA_PLATFORM: offscreen
      shell: bash
      run: |
        python tools/sms_converter/test_converter.py

    # This step has no `shell:` key, so it runs in pwsh -- keep each command on ONE line.
    # A trailing backslash is not a line continuation there and would truncate the build.
    - name: Build Windows 7 Executable
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SMS-Media-Converter-Win7" --icon "tools/sms_converter/assets/sms-converter.ico" --add-data "tools/sms_converter/assets;assets" --paths "tools/sms_converter" tools/sms_converter/main.py
        mkdir dist-artifact
        copy dist\SMS-Media-Converter-Win7.exe dist-artifact\SMS-Media-Converter-Win7.exe

    - name: Upload Windows 7 Executable
      uses: actions/upload-artifact@v7
      with:
        name: SMS-Media-Converter-Win7-${{ github.sha }}
        path: dist-artifact/*.exe
        retention-days: 90

    - name: Upload Windows 7 Executable to Rolling Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        for i in {1..12}; do
          if gh release upload rolling dist-artifact/SMS-Media-Converter-Win7.exe --clobber; then
            echo "Uploaded SMS-Media-Converter-Win7.exe to rolling release!"
            break
          fi
          echo "Waiting for rolling release creation..."
          sleep 10
        done

    - name: Upload Windows 7 Executable to Version Release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        for i in {1..12}; do
          if gh release upload "$GITHUB_REF_NAME" dist-artifact/SMS-Media-Converter-Win7.exe --clobber; then
            echo "Uploaded SMS-Media-Converter-Win7.exe to release $GITHUB_REF_NAME!"
            break
          fi
          echo "Waiting for release $GITHUB_REF_NAME..."
          sleep 10
        done
