name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the rolling / stable releases

jobs:
  # Legacy non-BDM build. Separate job so it runs in PARALLEL and its failure shows a
  # red check WITHOUT blocking the BDM=1 rolling/stable release below. BDM=0 is the
  # upstream legacy storage path (ROM system modules + the custom SMS_MC driver, no BDM
  # devices); it is never shipped, but the knob exists, so keep it building so it can't
  # silently rot the way it did before ( unguarded smbman fileXio calls broke the link ).
  build-legacy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Verify non-BDM (BDM=0) build links
      run: |
        docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:v1.0 \
          sh -c 'apk add --no-cache build-base git zip && make BDM=0 all'

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # IRX ABI gate. IOP loadcore binds a client module to a library provider by NAME +
    # MAJOR version only, then resolves every stub BY ORDINAL -- so a module built
    # against the wrong dev9 minor loads *clean* and simply never transfers a byte
    # (no error anywhere; this is exactly how the old smap_udpbd shipped dead). The
    # committed dev9-importing blobs must stay bound to SMS's embedded dev9 v1.1.
    # Assert on the .xz blobs -- the exact bytes the build embeds -- so a re-bound
    # module committed only as .xz cannot slip a v1.9 binding past the gate.
    - name: IRX ABI gate (dev9 v1.1 bindings)
      run: |
        python3 tools/irx_imports.py --assert dev9=1.1 irx/udpfs_smap.irx.xz irx/ata_bd.irx.xz

    # NOTE: we do NOT run the whole job inside the ps2dev container -- modern
    # GitHub Actions run their JS (checkout / upload) on Node, which the old
    # Alpine musl in ps2dev/ps2dev:v1.0 can't load. Check out on the host and run
    # only the build inside the toolchain container (ee-gcc 3.2.3, the exact
    # toolchain the project builds with locally).
    - name: Build (ps2dev v1.0 toolchain)
      run: |
        docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:v1.0 \
          sh -c 'apk add --no-cache build-base git zip && make all pack'

    - name: Package
      run: |
        mkdir -p dist
        cp bin/SMS.elf        dist/Simple-Media-System.elf
        cp bin/SMS-packed.elf dist/Simple-Media-System-packed.elf   # self-extracting, ~half the size
        # Stable filename, NOT commit-stamped. The rolling release is now updated in place
        # rather than deleted and recreated, so a per-commit name would pile up a new zip on
        # the release every single push and never clean any of them off. The commit is
        # recorded in the release notes, which is where it belongs.
        ( cd dist && zip -9 "Simple-Media-System.zip" Simple-Media-System.elf Simple-Media-System-packed.elf Simple-Media-System-DIAG.elf )

        # Language packs, shipped with the build they belong to. The .lng format is
        # EXACT-COUNT: a pack whose line count does not match this build's string table is
        # rejected outright, and until recently it was rejected SILENTLY -- a Spanish tester
        # spent a evening on a Language row that simply did nothing, having found a pack from
        # an older release. Publishing them here means the packs a user downloads are always
        # the ones that match the ELF sitting next to them.
        ( cd docs/translation && zip -9 "$OLDPWD/dist/Simple-Media-System-languages.zip" SMS.lng SMS.lng_* TRANSLATING.txt )
        ls -la dist

    # Diagnostic build, made AFTER the release one is already copied into dist/ so the
    # release ELF is never rebuilt. Same source with SMS_DIAG=1: each stage of the boot /
    # UDPFS / exit paths latches an "E<nn> <what>" code on screen just BEFORE the call it
    # names, and if that call never returns the code stays on screen. A tester on hardware
    # with no network and no memory card photographs the screen, and the last code IS the
    # blocking call. Shipped ALONGSIDE the release ELF, never instead of it.
    - name: Build diagnostic ELF (SMS_DIAG=1)
      run: |
        docker run --rm -v "$PWD":/src -w /src ps2dev/ps2dev:v1.0           sh -c 'apk add --no-cache build-base git zip && rm -rf obj bin && make SMS_DIAG=1 all'
        cp bin/SMS.elf dist/Simple-Media-System-DIAG.elf
        ls -la dist

    # Every build (push / PR / tag) leaves a downloadable artifact for that commit.
    - name: Upload build artifact
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: Simple-Media-System-${{ github.sha }}
        path: dist/Simple-Media-System.elf

    # --- Rolling pre-release: refreshed on EVERY push to the default branch ---
    # A single "rolling" tag/release always holds the latest master build, so
    # testers can just grab the newest ELF from the same URL.
    - name: Update rolling pre-release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > notes.md <<NOTES
        Latest development build of Simple-Media-System -- auto-updated on every push to master.

        Commit: $GITHUB_SHA
        Built:  $(date -u +'%Y-%m-%d %H:%M') UTC

        PLAYSTATION 2

        - Simple-Media-System.elf -- standard build. This is the one to use.
        - Simple-Media-System-packed.elf -- same build, self-extracting (~half the size, decompresses at boot).
        - Simple-Media-System-DIAG.elf -- same build plus on-screen diagnostics, for reporting a freeze.
          Each step of boot / network start / exit flashes an "E<nn>" code just BEFORE the step it
          names, and the code stays on screen if that step never finishes -- so the last code you
          can see is the thing that hung. Needs no network and no memory card. Use the standard
          ELF for normal playback.

        MEDIA CONVERTER -- desktop app that converts video and audio into formats SMS can play

        - SMS-Media-Converter.exe -- Windows 10/11.
        - SMS-Media-Converter-Win7.exe -- Windows 7. The standard exe cannot start there (Qt 6 and
          Python 3.9+ both dropped Windows 7), so this is a Qt5 / Python 3.8 build of the same app.
        - SMS-Media-Converter-Linux.zip -- Linux.

        LANGUAGES

        - Simple-Media-System-languages.zip -- translations for this exact build. Pick your
          language's SMS.lng_XX, rename it to SMS.lng, and put it next to the ELF (or on the
          memory card at mc0:/SMS/). You can also highlight a .lng file in the browser and
          install it from the file menu. Packs from a different release will be refused --
          the format is exact-count -- so use the ones from the build you are running.
        NOTES
        # UPDATE the release in place; do NOT delete and recreate it.
        #
        # The delete/recreate this replaces destroyed every asset on the release, including the
        # SMS-Media-Converter binaries that the separate sms-converter workflow uploads to the
        # same rolling tag. Both workflows fire on the same push, so which survived came down
        # to which finished first -- the PS2 build takes ~30s and the converter ~2min, so the
        # PS2 build almost always won and the converter re-uploaded afterwards. "Almost
        # always" is the problem: any run where that ordering flipped would silently publish a
        # release whose notes advertise converter downloads that are not attached.
        #
        # Create-if-missing, then edit + clobber-upload: idempotent, moves the tag to this
        # commit, refreshes the notes, and leaves other workflows' assets alone.
        gh release view rolling >/dev/null 2>&1 || \
          gh release create rolling --prerelease --target "$GITHUB_SHA" \
            --title "Rolling build (latest master)" --notes-file notes.md

        gh release edit rolling --target "$GITHUB_SHA" \
          --title "Rolling build (latest master)" --notes-file notes.md

        gh release upload rolling \
          dist/Simple-Media-System.elf \
          dist/Simple-Media-System-packed.elf \
          dist/Simple-Media-System-DIAG.elf \
          dist/*.zip --clobber

    # --- Stable release: cut when you push a version tag (e.g. git tag v1.0) ---
    - name: Create stable release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/Simple-Media-System.elf dist/Simple-Media-System-packed.elf dist/*.zip \
          --title "Simple-Media-System $GITHUB_REF_NAME" --generate-notes
